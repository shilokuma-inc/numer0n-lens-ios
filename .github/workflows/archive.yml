name: Archive

# 手動実行（workflow_dispatch）のみ。Archive → IPA Export まで通ることを確認する（アップロードはしない）。
# main への push で実行するのは Build だけ。develop / release/** への push は upload.yml が Archive を含む。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    uses: ./.github/workflows/_archive.yml
    with:
      upload: false
    secrets: inherit
